name: ICL Android APK

# Manual only: run it from the Actions tab (or on request) when a new APK is wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icl-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icl-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx ng build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # The signing key lives in repository secrets (Settings → Secrets and variables → Actions):
      # ICL_KEYSTORE_BASE64 (the keystore, base64) and ICL_KEYSTORE_PASSWORD.
      - name: Decode signing key
        env:
          ICL_KEYSTORE_BASE64: ${{ secrets.ICL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ICL_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ICL_KEYSTORE_BASE64 and ICL_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          echo "$ICL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/icl.keystore"

      - name: Build debug APK
        working-directory: icl-app/android
        env:
          ICL_BUILD_NUMBER: ${{ github.run_number }}
          ICL_KEYSTORE_PATH: ${{ runner.temp }}/icl.keystore
          ICL_KEYSTORE_PASSWORD: ${{ secrets.ICL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Every build must carry the same certificate, or Android won't install it as an update.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-256 digest: 3d68e907d8ad1da6b45d4125c0416ab22b45600c7c2c955887feec83f4f54144" certs.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ICL-${{ github.run_number }}.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/icl.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: ICL-apk
          path: icl-app/ICL-${{ github.run_number }}.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icl-apk-${{ github.run_number }}
          name: ICL app build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug APK of the ICL (Indoor Champion League) app, built from ${{ github.sha }}.
            Download ICL-${{ github.run_number }}.apk on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: icl-app/ICL-${{ github.run_number }}.apk
