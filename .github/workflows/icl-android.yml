name: ICL Android APK

# Manual only: run it from the Actions tab (or on request) when a new APK is wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icl-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icl-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships with the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx ng build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: icl-app/android
        env:
          ICL_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Every build must carry the same certificate, or Android won't install it as an update.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-256 digest: 43c9be6bf67332bd4d26823282ba8c057126" certs.txt

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ICL-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ICL-apk
          path: icl-app/ICL-${{ github.run_number }}.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icl-apk-${{ github.run_number }}
          name: ICL app build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug APK of the ICL (Indoor Champion League) app, built from ${{ github.sha }}.
            Download ICL-${{ github.run_number }}.apk on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: icl-app/ICL-${{ github.run_number }}.apk
