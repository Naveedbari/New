name: ICL Android APK

on:
  push:
    branches:
      - claude/kind-newton-g7yll9
    paths:
      - 'icl-app/**'
      - '.github/workflows/icl-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icl-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: icl-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx ng build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: icl-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ICL-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ICL-apk
          path: icl-app/ICL-${{ github.run_number }}.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icl-apk-${{ github.run_number }}
          name: ICL app build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug APK of the ICL (Indoor Champion League) app, built from ${{ github.sha }}.
            Download ICL-${{ github.run_number }}.apk on your Android phone and open it to install
            (allow "Install unknown apps" for your browser or file manager when asked).
          files: icl-app/ICL-${{ github.run_number }}.apk
