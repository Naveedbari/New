<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Indoor Champion League</title>
  <base href="/">
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#0e1116">
  <link rel="icon" type="image/svg+xml" href="assets/icon/icon.svg">
  <style>
    /* Start-up screen shown until the app has opened its database (matches the native splash). */
    html, body { background: #0e1116; }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(60% 45% at 50% 46%, rgba(34, 197, 94, 0.22), rgba(34, 197, 94, 0) 70%), #0e1116;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .boot img { width: 132px; height: 132px; animation: boot-in 0.6s ease-out both; }
    .boot p { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.35em; color: #9fb3a6; }
    .boot .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .boot .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #22c55e; animation: boot-bar 1.1s ease-in-out infinite; }
    @keyframes boot-in { from { opacity: 0; transform: scale(0.92); } }
    @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <app-root>
    <div class="boot">
      <img src="assets/icon/mark.svg" alt="ICL">
      <p>INDOOR CHAMPION LEAGUE</p>
      <div class="bar"></div>
    </div>
  </app-root>
</body>
</html>
