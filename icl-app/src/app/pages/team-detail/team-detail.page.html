<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/tabs/teams"></ion-back-button></ion-buttons>
    <ion-title>Team</ion-title>
    @if (team()) {
      <ion-buttons slot="end">
        <ion-button [routerLink]="['/teams', id, 'edit']" aria-label="Edit team">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
        <ion-button (click)="confirmDelete()" aria-label="Delete team">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (team(); as t) {
    <div class="banner">
      @if (t.logo) {
        <img class="logo" [src]="t.logo" [alt]="t.name + ' logo'" />
      } @else {
        <div class="logo placeholder">{{ t.name.charAt(0).toUpperCase() }}</div>
      }
      <h1>{{ t.name }}</h1>
    </div>

    <ion-list lines="full">
      <ion-item>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>
          <p>Captain</p>
          <h2>{{ t.captainName }}</h2>
        </ion-label>
      </ion-item>
      <ion-item [href]="telHref(t.captainPhone)">
        <ion-icon slot="start" name="call-outline"></ion-icon>
        <ion-label>
          <p>Captain phone</p>
          <h2>{{ t.captainPhone }}</h2>
        </ion-label>
        <ion-icon slot="end" name="call" color="success"></ion-icon>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="location-outline"></ion-icon>
        <ion-label class="ion-text-wrap">
          <p>Address</p>
          <h2>{{ t.address || '—' }}</h2>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="chatbubble-outline"></ion-icon>
        <ion-label class="ion-text-wrap">
          <p>Comment</p>
          <h2 class="comment">{{ t.comment || '—' }}</h2>
        </ion-label>
      </ion-item>
    </ion-list>
  }
</ion-content>
